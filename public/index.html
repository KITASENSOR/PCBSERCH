                { name: '\u7528\u91cf', rows: [['\u6bcd\u4ef6\u7de8\u865f', '\u5b50\u4ef6\u7de8\u865f', '\u6279\u91cf\u7528\u91cf', '\u54c1\u540d'], ...(data.tables?.usage_items || []).map(row => [row.parent_number, row.child_part_number, row.batch_quantity, row.item_name])] },
                { name: '\u5305\u88dd', rows: [['\u7522\u54c1\u7de8\u865f', '\u54c1\u540d\u898f\u683c', '\u5305\u88dd1'], ...(data.tables?.packaging || []).map(row => [row.product_number, row.specification, row.package_1])] },
                { name: '\u6392\u7a0b', rows: [['wo_id', 'part_no', 'side', 'plan_qty', 'real_qty', 'start_date', 'end_date', 'panel_size'], ...(data.tables?.schedule_items || []).map(row => [row.wo_id, row.part_no, row.side, row.plan_qty, row.real_qty, row.start_date, row.end_date, row.panel_size])] }
            ]);
            setStatusBox('maintenanceStatus', '\u532f\u51fa\u5b8c\u6210', 'ok');
        } catch (error) {
            setStatusBox('maintenanceStatus', error.message || '\u5931\u6557', 'error');
        }
    }

    async function loadScheduleFromDatabase() {
        clearStatusBox('pickingStatus');
        try {
            const response = await fetch(`/api/schedule?t=${Date.now()}`);
            const data = await response.json();
            if (!response.ok || data.error) throw new Error(data.error || '\u6392\u7a0b\u8b80\u53d6\u5931\u6557');
            scheduleGroups = data.groups || [];
            selectedPickingItems.clear();
            pickingAllItems = [];
            pickingComboKey = '';
            pickingNotes = {};
            warehouseView = false;
            scheduleDeleteMode = false;
            scheduleDeleteSelection.clear();
            renderScheduleGroups();
            document.getElementById('pickingResultArea').innerHTML = '';
            setStatusBox('pickingStatus', `\u6392\u7a0b\u8b80\u53d6\u5b8c\u6210\uff1a${data.count || 0} \u7b46\u5de5\u55ae`, 'ok');
        } catch (error) {
            setStatusBox('pickingStatus', error.message || '\u6392\u7a0b\u8b80\u53d6\u5931\u6557', 'error');
            renderScheduleGroups();
        }
    }

    function pickingModelDisplay(partNo) {
        const s = String(partNo || '');
        const i = s.indexOf('PC-');
        return i >= 0 ? s.slice(i) : s;
    }

    function formatScheduleDate(value) {
        const m = String(value || '').match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
        if (!m) return value || '';
        return `${parseInt(m[2], 10)}/${parseInt(m[3], 10)}`;
    }

    function mergeImportText(a, b, separator = '/') {
        const parts = new Set(String(a || '').split(separator).map(value => value.trim()).filter(Boolean));
        const next = String(b || '').trim();
        if (next) parts.add(next);
        return [...parts].join(separator);
    }

    function mergeImportEarlierDate(a, b) {
        const current = String(a || '').trim();
        const next = String(b || '').trim();
        if (!current) return next;
        if (!next) return current;
        return next < current ? next : current;
    }

    function mergeImportLaterDate(a, b) {
        const current = String(a || '').trim();
        const next = String(b || '').trim();
        if (!current) return next;
        if (!next) return current;
        return next > current ? next : current;
    }

    function mergeScheduleRowsForImport(rows) {
        const groups = new Map();
        rows.forEach(row => {
            const woId = String(row.wo_id || '').trim();
            const partNo = String(row.part_no || '').trim();
            const planQty = toClientNumber(row.plan_qty);
            const realQty = toClientNumber(row.real_qty);
            if (!woId || !partNo || planQty <= 0) return;

            const normalized = {
                ...row,
                wo_id: woId,
                part_no: partNo,
                side: String(row.side || '').trim(),
                plan_qty: planQty,
                real_qty: realQty,
                start_date: String(row.start_date || '').trim(),
                end_date: String(row.end_date || '').trim(),
                panel_size: String(row.panel_size || '').trim()
            };
            if (!groups.has(woId)) groups.set(woId, []);
            groups.get(woId).push(normalized);
        });

        return [...groups.values()].map(group => {
            const datedRows = group.filter(row => String(row.start_date || '').trim() !== '');
            const baseRows = datedRows.length > 0 ? datedRows : group;
            const base = { ...baseRows[0] };

            if (datedRows.length === 0) {
                base.plan_qty = group.reduce((sum, row) => sum + toClientNumber(row.plan_qty), 0);
                base.real_qty = group.reduce((sum, row) => sum + toClientNumber(row.real_qty), 0);
            } else {
                base.plan_qty = toClientNumber(base.plan_qty);
                base.real_qty = toClientNumber(base.real_qty);
            }

            base.side = group.reduce((value, row) => mergeImportText(value, row.side), '');
            base.start_date = baseRows.reduce((value, row) => mergeImportEarlierDate(value, row.start_date), '');
            base.end_date = group.reduce((value, row) => mergeImportLaterDate(value, row.end_date), '');
            const panelRow = group.find(row => String(row.panel_size || '').trim() !== '');
            base.panel_size = panelRow ? String(panelRow.panel_size || '').trim() : '';
            return base;
        });
    }

    function isScheduledDate(value) {
        const text = String(value || '').trim();
        return text !== '' && text !== '未排日期';
    }

    function isScheduledGroup(group) {
        return isScheduledDate(group?.date);
    }

    function isDoneItem(item) {
        // 完工＝完工日已過（end_date 早於今天）
        const match = String(item?.end_date || '').trim().match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
        if (!match) return false;
        const endDate = new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3]));
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        return endDate < today;
    }

    function doneScheduleGroups() {
        return scheduleGroups
            .map(group => ({ ...group, items: (group.items || []).filter(isDoneItem) }))
            .filter(group => group.items.length > 0);
    }

    function visibleScheduleGroups() {
        if (scheduleFilterMode === 'scheduled') return scheduleGroups.filter(isScheduledGroup);
        if (scheduleFilterMode === 'unscheduled') return scheduleGroups.filter(group => !isScheduledGroup(group));
        if (scheduleFilterMode === 'done') return doneScheduleGroups();
        return scheduleGroups;
    }

    function countScheduleItems(groups) {
        return groups.reduce((sum, group) => sum + ((group.items || []).length), 0);
    }

    function setScheduleFilter(mode) {
        scheduleFilterMode = mode;
        renderScheduleGroups();
    }

    function renderScheduleCollapseState() {
        const button = document.getElementById('scheduleCollapseBtn');
        const tabs = document.getElementById('scheduleFilterTabs');
        const list = document.getElementById('pickingScheduleList');
        if (button) {
            button.textContent = scheduleListCollapsed ? '▼' : '▲';
            button.title = scheduleListCollapsed ? '展開排程列表' : '收闔排程列表';
            button.setAttribute('aria-label', button.title);
            button.setAttribute('aria-expanded', String(!scheduleListCollapsed));
        }
        if (tabs) tabs.style.display = scheduleListCollapsed ? 'none' : '';
        if (list) list.style.display = scheduleListCollapsed ? 'none' : '';
    }

    function toggleScheduleListCollapsed() {
        scheduleListCollapsed = !scheduleListCollapsed;
        renderScheduleCollapseState();
    }

    function renderScheduleFilterTabs() {
        const scheduledCount = countScheduleItems(scheduleGroups.filter(isScheduledGroup));
        const unscheduledCount = countScheduleItems(scheduleGroups.filter(group => !isScheduledGroup(group)));
        const allCount = scheduledCount + unscheduledCount;
        const doneCount = countScheduleItems(doneScheduleGroups());
        [
            ['scheduleFilterAll', 'all', `全部 ${allCount}`],
            ['scheduleFilterScheduled', 'scheduled', `已排 ${scheduledCount}`],
            ['scheduleFilterUnscheduled', 'unscheduled', `未排 ${unscheduledCount}`],
            ['scheduleFilterDone', 'done', `完工 ${doneCount}`]
        ].forEach(([id, mode, label]) => {
            const button = document.getElementById(id);
            if (!button) return;
            button.textContent = label;
            button.classList.toggle('active', scheduleFilterMode === mode);
        });
    }

    function renderScheduleGroups() {
        const list = document.getElementById('pickingScheduleList');
        if (!list) return;
        renderScheduleFilterTabs();
        renderScheduleCollapseState();
        if (scheduleGroups.length === 0) {
            list.innerHTML = '<div class="hint">\u5c1a\u672a\u4e0a\u50b3\u6392\u7a0b\u3002</div>';
            return;
        }
        const groups = visibleScheduleGroups();
        if (groups.length === 0) {
            list.innerHTML = '<div class="hint">此篩選沒有排程。</div>';
            return;
        }
        const toolbarClass = scheduleDeleteMode ? 'schedule-delete-toolbar show' : 'schedule-delete-toolbar';
        const toolbarText = scheduleDeleteMode ? `已選 ${scheduleDeleteSelection.size} 筆排程` : '';
        const toolbar = `<div class="${toolbarClass}"><span>${toolbarText || '長按型號可多選刪除排程'}</span><button type="button" class="clear-btn" onclick="cancelScheduleDeleteMode()">取消</button><button type="button" class="filter-btn" onclick="deleteSelectedScheduleItems()">刪除</button></div>`;
        let rows = '';
        groups.forEach(group => {
            (group.items || []).forEach(item => {
                const key = encodeURIComponent(item.wo_id);
                const checked = selectedPickingItems.has(item.wo_id);
                const deleteSelected = scheduleDeleteSelection.has(item.wo_id);
                const model = pickingModelDisplay(item.part_no);
                const qty = formatClientNumber(item.plan_qty);
                rows += `<tr class="schedule-row${checked ? ' is-checked' : ''}${deleteSelected ? ' is-delete-selected' : ''}" onmousedown="startScheduleLongPress('${key}', event)" onmouseup="clearScheduleLongPress()" onmouseleave="clearScheduleLongPress()" ontouchstart="startScheduleLongPress('${key}', event)" ontouchend="clearScheduleLongPress()" ontouchcancel="clearScheduleLongPress()" oncontextmenu="event.preventDefault()"><td>${escapeHtml(formatScheduleDate(group.date))}</td><td class="schedule-model">${escapeHtml(model)}</td><td class="result-number">${qty}</td><td class="schedule-check" onclick="toggleScheduleRow('${key}')"><input type="checkbox" tabindex="-1"${(scheduleDeleteMode ? deleteSelected : checked) ? ' checked' : ''}></td></tr>`;
            });
        });
        list.innerHTML = `${toolbar}<table class="schedule-table"><thead><tr><th>\u4e0a\u7dda\u65e5</th><th>\u578b\u865f</th><th>\u6578\u91cf</th><th>\u2713</th></tr></thead><tbody>${rows}</tbody></table>`;
    }

    function findScheduleItem(woId) {
        for (const group of scheduleGroups) {
            const found = (group.items || []).find(item => item.wo_id === woId);
            if (found) return found;
        }
        return null;
    }

    function toggleScheduleRow(encodedWoId) {
        if (scheduleLongPressTriggered) {
            scheduleLongPressTriggered = false;
            return;
        }
        const woId = decodeURIComponent(encodedWoId);
        if (scheduleDeleteMode) {
            toggleScheduleDeleteSelection(woId);
            return;
        }
        const item = findScheduleItem(woId);
        if (!item) return;
        if (selectedPickingItems.has(woId)) selectedPickingItems.delete(woId);
        else selectedPickingItems.set(woId, item);
        warehouseView = false;
        renderScheduleGroups();
        calculatePickingMaterials();
    }

    function startScheduleLongPress(encodedWoId, event) {
        clearScheduleLongPress();
        const woId = decodeURIComponent(encodedWoId);
        scheduleLongPressTriggered = false;
        scheduleLongPressTimer = setTimeout(() => {
            scheduleLongPressTriggered = true;
            scheduleDeleteMode = true;
            scheduleDeleteSelection.add(woId);
            renderScheduleGroups();
            setStatusBox('pickingStatus', '已進入排程刪除模式，可多選後刪除。', 'warn');
        }, 800);
    }

    function clearScheduleLongPress() {
        if (scheduleLongPressTimer) {
            clearTimeout(scheduleLongPressTimer);
            scheduleLongPressTimer = null;
        }
    }

    function toggleScheduleDeleteSelection(woId) {
        if (scheduleDeleteSelection.has(woId)) scheduleDeleteSelection.delete(woId);
        else scheduleDeleteSelection.add(woId);
        if (scheduleDeleteSelection.size === 0) scheduleDeleteMode = false;
        renderScheduleGroups();
    }

    function cancelScheduleDeleteMode() {
        scheduleDeleteMode = false;
        scheduleDeleteSelection.clear();
        clearStatusBox('pickingStatus');
        renderScheduleGroups();
    }

    async function deleteSelectedScheduleItems() {
        const woIds = [...scheduleDeleteSelection];
        if (woIds.length === 0) {
            setStatusBox('pickingStatus', '請先選擇要刪除的排程。', 'warn');
            return;
        }
        if (!confirm(`即將刪除 ${woIds.length} 筆排程，並移除包含這些工單組合的備註紀錄。確定刪除？`)) return;
        try {
            setStatusBox('pickingStatus', '刪除排程中，請稍候...', 'warn');
            const response = await fetch('/api/schedule/delete', {
                method: 'POST',
                headers: { 'content-type': 'application/json; charset=utf-8' },
                body: JSON.stringify({ wo_ids: woIds })
            });
            const data = await response.json();
            if (!response.ok || data.error) throw new Error(data.error || '刪除失敗');
            await loadScheduleFromDatabase();
            setStatusBox('pickingStatus', `刪除完成：排程 ${data.deleted_schedule || 0} 筆，備註組合 ${data.deleted_note_combos || 0} 組`, 'ok');
        } catch (error) {
            setStatusBox('pickingStatus', error.message || '刪除失敗', 'error');
        }
    }

    function clearPickingSelection() {
        selectedPickingItems.clear();
        pickingAllItems = [];
        pickingComboKey = '';
        pickingNotes = {};
        warehouseView = false;
        scheduleDeleteMode = false;
        scheduleDeleteSelection.clear();
        document.getElementById('pickingResultArea').innerHTML = '';
        renderScheduleGroups();
    }

    let pickingCalcSeq = 0;
    async function calculatePickingMaterials(modelSource = null) {
        const sourceItems = modelSource || [...selectedPickingItems.values()];
        const models = sourceItems.map(item => ({ wo_id: item.wo_id, part_no: item.part_no, plan_qty: item.plan_qty }));
        if (models.length === 0) {
            pickingAllItems = [];
            pickingComboKey = '';
            pickingNotes = {};
            document.getElementById('pickingResultArea').innerHTML = '';
            clearStatusBox('pickingStatus');
            return;
        }
        const seq = ++pickingCalcSeq;
        setStatusBox('pickingStatus', '\u8a08\u7b97\u4e2d\uff0c\u8acb\u7a0d\u5019...', 'warn');
        try {
            const data = await calculateMaterialsFromStaticData(models);
            if (seq !== pickingCalcSeq) return;
            if (data.error) throw new Error(data.error || '\u5931\u6557');
            pickingComboKey = pickingComboKeyFromModels(models);
            await loadPickingNotes(pickingComboKey, seq);
            if (seq !== pickingCalcSeq) return;
            renderPickingResults(data.items || []);
            setStatusBox('pickingStatus', `\u8a08\u7b97\u5b8c\u6210\uff1a${data.count || 0} \u7b46\u7269\u6599`, 'ok');
        } catch (error) {
            if (seq !== pickingCalcSeq) return;
            setStatusBox('pickingStatus', error.message || '\u8a08\u7b97\u5931\u6557', 'error');
        }
    }

    function isWarehouseItem(item) {
        const name = String(item.item_name || '').toUpperCase();
        const code = String(item.child_part_number || '').toUpperCase().trim();
        return name.includes('MCU') || code.startsWith('EL-');
    }

    function renderPickingResults(items) {
        pickingAllItems = items || [];
        renderPickingTable();
    }

    function renderPickingTable() {
        const area = document.getElementById('pickingResultArea');
        if (!area) return;
        let items = pickingAllItems;
        if (warehouseView) items = items.filter(isWarehouseItem);
        if (!items.length) {
            area.innerHTML = `<div class="hint">${warehouseView ? '\u6c92\u6709 EL-\uff0fMCU \u5009\u7ba1\u6599\u3002' : '\u6c92\u6709\u627e\u5230\u7528\u91cf\u8cc7\u6599\u3002'}</div>`;
            return;
        }
        area.innerHTML = `<table><colgroup><col class="picking-col-part"><col class="picking-col-qty"><col class="picking-col-roll"><col class="picking-col-note"></colgroup><thead><tr><th>\u7269\u6599</th><th>\u7528\u91cf</th><th>\u6372\u6578</th><th>\u5099\u8a3b</th></tr></thead><tbody>${items.map(item => {
            const pkg = (item.package_count === null || item.package_count === undefined) ? null : item.package_count;
            const pkgText = pkg === null ? '' : formatClientNumber(pkg, Number.isInteger(pkg) ? 0 : 1);
            const pkgClass = (pkg !== null && pkg > 1) ? ' roll-warn' : '';
            const part = item.child_part_number;
            const noteVal = (pickingNotes[part] === undefined || pickingNotes[part] === null) ? '' : pickingNotes[part];
            return `<tr class="picking-result-row" onclick="this.classList.toggle('dimmed')"><td>${escapeHtml(part)}</td><td class="result-number">${formatClientNumber(item.required_quantity, Number.isInteger(item.required_quantity) ? 0 : 3)}</td><td class="result-number picking-roll-cell${pkgClass}">${pkgText}</td><td class="picking-note-cell" onclick="event.stopPropagation()"><input type="text" inputmode="decimal" class="picking-note-input" value="${escapeHtml(String(noteVal))}" data-part="${escapeHtml(part)}" readonly onclick="openPickingNoteDialog(this)"></td></tr>`;
        }).join('')}</tbody></table>`;
    }

    function pickingComboKeyFromSelection() {
        // 「相同組合」以選取的工單號碼集合判定（不分順序）
        return pickingComboKeyFromModels([...selectedPickingItems.values()]);
    }

    function pickingComboKeyFromModels(models) {
        return [...(models || [])]
            .map(item => item?.wo_id)
            .map(id => String(id).trim())
            .filter(Boolean)
            .sort((a, b) => a.localeCompare(b, undefined, { numeric: true }))
            .join('|');
    }

    async function loadPickingNotes(key, seq) {
        pickingNotes = {};
        if (!key) return;
        try {
            const response = await fetch(`/api/picking/notes?key=${encodeURIComponent(key)}&t=${Date.now()}`);
            const data = await response.json();
            if (seq !== pickingCalcSeq) return;
            if (response.ok && data && data.notes) pickingNotes = data.notes;
        } catch (error) {
            // 備註讀取失敗不影響計算結果，維持空白即可
        }
    }

    function cleanPickingNoteValue(value) {
        let valueText = String(value || '').replace(/[^\d.]/g, '');
        const firstDot = valueText.indexOf('.');
        if (firstDot !== -1) {
            valueText = valueText.slice(0, firstDot + 1) + valueText.slice(firstDot + 1).replace(/\./g, '');
        }
        return valueText;
    }

    function openPickingNoteDialog(input) {
        activePickingNoteInput = input;
        activePickingNotePart = input.getAttribute('data-part') || '';
        const backdrop = document.getElementById('pickingNoteBackdrop');
        const dialogInput = document.getElementById('pickingNoteDialogInput');
        const title = document.getElementById('pickingNoteDialogTitle');
        if (!backdrop || !dialogInput || !title) return;

        title.textContent = `備註數量：${activePickingNotePart}`;
        dialogInput.value = input.value || '';
        dialogInput.oninput = () => { dialogInput.value = cleanPickingNoteValue(dialogInput.value); };
        dialogInput.onkeydown = event => {
            if (event.key === 'Enter') confirmPickingNoteDialog();
            if (event.key === 'Escape') cancelPickingNoteDialog();
        };
        backdrop.classList.add('show');
        setTimeout(() => {
            dialogInput.focus();
            dialogInput.select();
        }, 0);
    }

    function cancelPickingNoteDialog(event) {
        if (event && event.target !== event.currentTarget) return;
        const backdrop = document.getElementById('pickingNoteBackdrop');
        if (backdrop) backdrop.classList.remove('show');
        if (activePickingNoteInput) activePickingNoteInput.focus();
        activePickingNoteInput = null;
        activePickingNotePart = '';
    }

    function confirmPickingNoteDialog() {
        if (!activePickingNoteInput || !activePickingNotePart) {
            cancelPickingNoteDialog();
            return;
        }
        const dialogInput = document.getElementById('pickingNoteDialogInput');
        const value = cleanPickingNoteValue(dialogInput?.value || '');
        activePickingNoteInput.value = value;
        updatePickingNote(activePickingNotePart, value);
        cancelPickingNoteDialog();
    }

    function updatePickingNote(part, value) {
        if (value === '') delete pickingNotes[part];
        else pickingNotes[part] = value;
        const key = pickingComboKey;
        clearTimeout(pickingNoteSaveTimers[part]);
        pickingNoteSaveTimers[part] = setTimeout(() => savePickingNote(key, part, value), 400);
    }

    async function savePickingNote(key, part, note) {
        if (!key || !part) return;
        try {
            await fetch('/api/picking/notes', {
                method: 'POST',
                headers: { 'content-type': 'application/json; charset=utf-8' },
                body: JSON.stringify({ key, child_part_number: part, note })
            });
        } catch (error) {
            // 備註儲存失敗時靜默處理，下次輸入會再嘗試
        }
    }

    function getScheduledItems() {
        return scheduleGroups
            .filter(isScheduledGroup)
            .flatMap(group => group.items || []);
    }

    function showScheduledWarehouseMaterials() {
        const items = getScheduledItems();
        if (items.length === 0) {
            setStatusBox('pickingStatus', '目前沒有已排程的工單。', 'warn');
            return;
        }
        warehouseView = true;
        calculatePickingMaterials(items);
    }

    function pastePickingToBOM() {
        const selected = [...selectedPickingItems.values()];
        if (selected.length === 0) { setStatusBox('pickingStatus', '\u8acb\u5148\u52a0\u5165\u8981\u8cbc\u5230 BOM \u67e5\u8a62\u7684\u578b\u865f', 'warn'); return; }
        const input = document.getElementById('inputSearch');
        const nextText = [...new Set(selected.map(item => item.part_no))].join('\n');
        if (input.value.trim()) {
            const shouldClear = confirm('BOM \u67e5\u8a62\u5df2\u6709\u8f38\u5165\u5167\u5bb9\uff0c\u662f\u5426\u6e05\u7a7a\u5f8c\u8cbc\u4e0a\uff1f\u6309\u53d6\u6d88\u6703\u9644\u52a0\u5728\u539f\u5167\u5bb9\u5f8c\u9762\u3002');
            input.value = shouldClear ? nextText : `${input.value.trim()}\n${nextText}`;
        } else {
            input.value = nextText;
        }
        localStorage.setItem(storageKeys.bomInput, input.value);
        toggleView('BOM');
    }

    renderScheduleGroups();
    const machineEls = {
        doneCount: document.getElementById('machineDoneCount'),
        startTime: document.getElementById('machineStartTime'),
        endTime: document.getElementById('machineEndTime'),
        workSecond: document.getElementById('machineWorkSecond'),
        targetCount: document.getElementById('machineTargetCount'),
        resultLabelA: document.getElementById('machineResultLabelA'),
        resultLabelB: document.getElementById('machineResultLabelB'),
        resultLabelC: document.getElementById('machineResultLabelC'),
        resultA: document.getElementById('machineResultA'),
        resultB: document.getElementById('machineResultB'),
        resultC: document.getElementById('machineResultC'),
        warningBox: document.getElementById('machineWarningBox'),
        errorBox: document.getElementById('machineErrorBox'),
        tabByBoards: document.getElementById('machineTabByBoards'),
        tabByEnd: document.getElementById('machineTabByEnd')
    };

    function machinePad(n) {
        return String(n).padStart(2, '0');
    }

    function cleanMachineDigits(value, maxLength = null) {
        let digits = String(value || '').replace(/\D/g, '');
        if (maxLength !== null) digits = digits.slice(0, maxLength);
        return digits;
    }

    function formatMachineTimeTyping(el) {
        const digits = cleanMachineDigits(el.value, 4);
        if (digits.length >= 3) {
            el.value = `${digits.slice(0, 2)}:${digits.slice(2)}`;
        } else {
            el.value = digits;
        }
    }

    function normalizeMachineTimeInput(el) {
        const raw = String(el.value || '').trim();
        let h = null;
        let m = null;

        const colonMatch = raw.match(/^(\d{1,2}):(\d{1,2})$/);
        if (colonMatch) {
            h = Number(colonMatch[1]);
            m = Number(colonMatch[2]);
        } else {
            const digits = cleanMachineDigits(raw, 4);
            if (digits.length === 0) {
                el.value = '';
                return;
            }
            if (digits.length <= 2) {
                h = Number(digits);
                m = 0;
            } else if (digits.length === 3) {
                h = Number(digits.slice(0, 1));
                m = Number(digits.slice(1));
            } else {
                h = Number(digits.slice(0, 2));
                m = Number(digits.slice(2));
            }
        }

        if (!Number.isFinite(h) || !Number.isFinite(m)) {
            el.value = '';
            return;
        }

        h = Math.max(0, Math.min(23, Math.floor(h)));
        m = Math.max(0, Math.min(59, Math.floor(m)));
        el.value = `${machinePad(h)}:${machinePad(m)}`;
    }

    function machineTimeToMinutes(value) {
        if (!value || !/^\d{2}:\d{2}$/.test(value)) return null;
        const [h, m] = value.split(':').map(Number);
        if (h < 0 || h > 23 || m < 0 || m > 59) return null;
        return h * 60 + m;
    }

    function machineMinutesToTime(totalMinutes) {
        const oneDay = 24 * 60;
        const minuteNumber = Math.floor(totalMinutes);
        const minuteOfDay = ((minuteNumber % oneDay) + oneDay) % oneDay;
        const h = Math.floor(minuteOfDay / 60);
        const m = Math.floor(minuteOfDay % 60);
        return `${machinePad(h)}:${machinePad(m)}`;
    }

    function machineSecondsToTime(totalSeconds) {
        const roundedUpMinutes = Math.ceil(totalSeconds / 60);
        return machineMinutesToTime(roundedUpMinutes);
    }

    function getCurrentMachineTimeValue() {
        const now = new Date();
        return `${machinePad(now.getHours())}:${machinePad(now.getMinutes())}`;
    }

    function getMachineMode() {
        const checked = document.querySelector('input[name="machineCalcMode"]:checked');
        return checked ? checked.value : 'byBoards';
    }

    function cleanMachineDecimal(value) {
        let raw = String(value || '').replace(/[^0-9.]/g, '');
        const parts = raw.split('.');
        let cleaned = parts.shift() || '';

        if (parts.length > 0) {
            cleaned += '.' + parts.join('');
        }

        if (cleaned.startsWith('.')) cleaned = '0' + cleaned;
        return cleaned;
    }

    function normalizeMachineDecimalInput(el) {
        el.value = cleanMachineDecimal(el.value);
    }

    function getPositiveMachineNumber(el) {
        const value = Number(el.value);
        return Number.isFinite(value) && value > 0 ? value : 0;
    }

    function getNonNegativeMachineNumber(el) {
        const value = Number(el.value);
        return Number.isFinite(value) && value >= 0 ? value : 0;
    }

    function formatMachineNumber(value) {
        if (!Number.isFinite(value)) return '';
        return String(Number(value.toFixed(4)));
    }

    function getMachineWorkSeconds() {
        return getPositiveMachineNumber(machineEls.workSecond);
    }

    function formatMachineDuration(totalSeconds) {
        if (!Number.isFinite(totalSeconds) || totalSeconds < 0) return '';

        totalSeconds = Math.round(totalSeconds);
        const hours = Math.floor(totalSeconds / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;

        return `${hours}時 ${minutes}分 ${seconds}秒`;
    }

    function setMachineNotice(type, message) {
        machineEls.warningBox.style.display = 'none';
        machineEls.errorBox.style.display = 'none';
        machineEls.warningBox.textContent = '';
        machineEls.errorBox.textContent = '';

        if (!message) return;

        const box = type === 'error' ? machineEls.errorBox : machineEls.warningBox;
        box.textContent = message;
        box.style.display = 'block';
    }

    function setMachineModeUI() {
        const mode = getMachineMode();

        machineEls.tabByBoards.classList.toggle('active', mode === 'byBoards');
        machineEls.tabByEnd.classList.toggle('active', mode === 'byEnd');

        document.querySelectorAll('.machine-scenario-field').forEach(field => {
            field.style.display = field.dataset.machineMode === mode ? 'flex' : 'none';
        });

        if (mode === 'byBoards') {
            machineEls.resultLabelA.textContent = '還能打數量';
            machineEls.resultLabelB.textContent = '預估總完成';
            machineEls.resultLabelC.textContent = '剩餘時間';
        } else {
            machineEls.resultLabelA.textContent = '剩餘數量';
            machineEls.resultLabelB.textContent = '還需要時間';
            machineEls.resultLabelC.textContent = '預估完成時間';
        }
    }

    function saveMachineTimeState() {
        const data = {
            mode: getMachineMode(),
            doneCount: machineEls.doneCount.value,
            startTime: machineEls.startTime.value,
            endTime: machineEls.endTime.value,
            workSecond: machineEls.workSecond.value,
            targetCount: machineEls.targetCount.value
        };
        localStorage.setItem(storageKeys.machineTime, JSON.stringify(data));
    }

    function loadMachineTimeState() {
        try {
            const raw = localStorage.getItem(storageKeys.machineTime);
            if (!raw) return false;

            const data = JSON.parse(raw);
            if (data.mode) {
                const radio = document.querySelector(`input[name="machineCalcMode"][value="${data.mode}"]`);
                if (radio) radio.checked = true;
            }

            machineEls.doneCount.value = cleanMachineDecimal(data.doneCount || '');
            machineEls.startTime.value = data.startTime || '';
            machineEls.endTime.value = data.endTime || '';
            machineEls.workSecond.value = cleanMachineDecimal(data.workSecond || '');
            machineEls.targetCount.value = cleanMachineDecimal(data.targetCount || data.boardCount || '');

            if (machineEls.startTime.value) normalizeMachineTimeInput(machineEls.startTime);
            if (machineEls.endTime.value) normalizeMachineTimeInput(machineEls.endTime);

            return true;
        } catch (e) {
            return false;
        }
    }

    function clearMachineResults() {
        machineEls.resultA.textContent = '--';
        machineEls.resultB.textContent = '--';
        machineEls.resultC.textContent = '--';
        setMachineNotice('', '');
        saveMachineTimeState();
    }

    function calculateMachineTime() {
        setMachineModeUI();

        const mode = getMachineMode();
        const startMinutes = machineTimeToMinutes(machineEls.startTime.value);
        const endMinutesRaw = machineTimeToMinutes(machineEls.endTime.value);
        const workSeconds = getMachineWorkSeconds();
        const doneCount = getNonNegativeMachineNumber(machineEls.doneCount);

        if (startMinutes === null || workSeconds <= 0) {
            clearMachineResults();
            return;
        }

        if (mode === 'byBoards') {
            if (endMinutesRaw === null) {
                clearMachineResults();
                saveMachineTimeState();
                return;
            }

            let availableMinutes = endMinutesRaw - startMinutes;
            if (availableMinutes < 0) availableMinutes += 24 * 60;

            const availableSeconds = availableMinutes * 60;
            const possibleCount = Math.floor(availableSeconds / workSeconds);
            const estimatedTotal = doneCount + possibleCount;

            machineEls.resultA.textContent = formatMachineNumber(possibleCount);
            machineEls.resultB.textContent = formatMachineNumber(estimatedTotal);
            machineEls.resultC.textContent = formatMachineDuration(availableSeconds);
        } else {
            const targetCount = getPositiveMachineNumber(machineEls.targetCount);

            if (targetCount <= 0) {
                clearMachineResults();
                saveMachineTimeState();
                return;
            }

            const remainingCount = Math.max(0, targetCount - doneCount);
            const neededSeconds = remainingCount * workSeconds;

            machineEls.resultA.textContent = formatMachineNumber(remainingCount);
            machineEls.resultB.textContent = formatMachineDuration(neededSeconds);
            machineEls.resultC.textContent = machineSecondsToTime(startMinutes * 60 + neededSeconds);
        }

        setMachineNotice('', '');
        saveMachineTimeState();
    }

    function setMachineNow() {
        machineEls.startTime.value = getCurrentMachineTimeValue();
        calculateMachineTime();
    }

    function clearMachineTime() {
        localStorage.removeItem(storageKeys.machineTime);
        document.querySelector('input[name="machineCalcMode"][value="byBoards"]').checked = true;
        machineEls.doneCount.value = '';
        machineEls.startTime.value = getCurrentMachineTimeValue();
        machineEls.endTime.value = '';
        machineEls.workSecond.value = '';
        machineEls.targetCount.value = '';
        machineEls.resultA.textContent = '--';
        machineEls.resultB.textContent = '--';
        machineEls.resultC.textContent = '--';
        setMachineNotice('', '');
        calculateMachineTime();
    }

    function bindMachineTimeInput(el) {
        if (!el) return;

        const clearForEdit = () => {
            if (!el.value) return;
            el.value = '';
            calculateMachineTime();
        };
        const updateTyping = () => {
            formatMachineTimeTyping(el);
            calculateMachineTime();
        };

        const updateFinal = () => {
            normalizeMachineTimeInput(el);
            calculateMachineTime();
        };

        el.addEventListener('click', clearForEdit);
        el.addEventListener('input', updateTyping);
        el.addEventListener('keyup', updateTyping);
        el.addEventListener('change', updateFinal);
        el.addEventListener('blur', updateFinal);
        el.addEventListener('compositionend', updateFinal);
    }

    function bindMachineDecimalInput(el) {
        if (!el) return;

        const clearForEdit = () => {
            if (!el.value) return;
            el.value = '';
            calculateMachineTime();
        };
        const update = () => {
            normalizeMachineDecimalInput(el);
            calculateMachineTime();
        };

        el.addEventListener('click', clearForEdit);
        el.addEventListener('input', update);
        el.addEventListener('keyup', update);
        el.addEventListener('change', update);
        el.addEventListener('blur', update);
        el.addEventListener('compositionend', update);
    }

    function initMachineTimeCalculator() {
        const restored = loadMachineTimeState();

        if (!restored || !machineEls.startTime.value) {
            machineEls.startTime.value = getCurrentMachineTimeValue();
        }

        [machineEls.startTime, machineEls.endTime].forEach(bindMachineTimeInput);
        [machineEls.doneCount, machineEls.workSecond, machineEls.targetCount].forEach(bindMachineDecimalInput);

        document.querySelectorAll('input[name="machineCalcMode"]').forEach(el => {
            el.addEventListener('change', calculateMachineTime);
            el.addEventListener('click', calculateMachineTime);
        });

        calculateMachineTime();
    }

    initMachineTimeCalculator();

</script>
</body>
</html>
