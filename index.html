<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>PCB用料查詢導向中</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
            background: #f4f7f9;
            color: #24313d;
        }
        main {
            width: min(92vw, 520px);
            padding: 28px;
            background: #fff;
            border: 1px solid #dfe6ee;
            border-radius: 8px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
            line-height: 1.7;
        }
        h1 {
            margin: 0 0 12px;
            font-size: 24px;
        }
        a {
            color: #0b72b9;
            font-weight: 700;
        }
        .notice {
            color: #6b7785;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <main>
        <h1>PCB用料查詢已搬移</h1>
        <p id="redirectMessage">正在導向新的 Cloudflare Worker 網址...</p>
        <p class="notice">若未自動導向，請點選下方連結。</p>
        <p><a id="targetLink" href="#">前往新版查詢頁</a></p>
    </main>

    <script>
        const workerUrl = "https://smt-pcb-search.s110513202.workers.dev/";
        const link = document.getElementById("targetLink");
        const message = document.getElementById("redirectMessage");

        link.href = workerUrl;

        if (workerUrl.includes("<")) {
            message.textContent = "尚未填入正式 workers.dev 網址，部署後請替換 index.html 內的 workerUrl。";
        } else {
            window.location.replace(workerUrl);
        }
    </script>
</body>
</html>
